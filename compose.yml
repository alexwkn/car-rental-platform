services:
  db:
    image: postgres:15-alpine
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  back:
    build: ./back
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PEPPER: ${PEPPER}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      - uploads:/app/upload

  front:
    build:
      context: ./front
      args:
        VITE_API_ROUTE: http://localhost:3001
    depends_on:
      back:
        condition: service_started
    ports:
      - "8080:80"

  mobile:
    build: ./Key2Go
    env_file:
      - ./Key2Go/.env
    depends_on:
      back:
        condition: service_started
    ports:
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
      - "8081:8081"
    volumes:
      - ./Key2Go:/app
      - /app/node_modules
    stdin_open: true
    tty: true

volumes:
  pgdata:
  uploads:
